---
server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.tradingbot: DEBUG

spring:
  application:
    name: multi-broker-trading-bot
  r2dbc:
    url: >-
      ${R2DBC_URL:r2dbc:h2:mem:///tradingbot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  main:
    web-application-type: reactive

trading-bot:
  brokers:
    kite:
      enabled: ${KITE_ENABLED:true}
      api-key: ${KITE_API_KEY:mock_kite_api_key}
      api-secret: ${KITE_API_SECRET:mock_kite_secret}
      user-id: ${KITE_USER_ID:mock_kite_user}
      password: ${KITE_PASSWORD:mock_kite_password}
      totp-secret: ${KITE_TOTP_SECRET:JBSWY3DPEHPK3PXP}
      base-url: ${KITE_BASE_URL:https://api.kite.trade}
      # Optional: daily access token to skip headless login
      access-token: ${KITE_ACCESS_TOKEN:}
    shoonya:
      enabled: ${SHOONYA_ENABLED:true}
      client-id: ${SHOONYA_CLIENT_ID:mock_shoonya_client}
      secret-key: ${SHOONYA_SECRET_KEY:mock_shoonya_secret}
      user-id: ${SHOONYA_USER_ID:mock_shoonya_user}
      account-id: ${SHOONYA_ACCOUNT_ID:mock_shoonya_act}
      password: ${SHOONYA_PASSWORD:mock_shoonya_password}
      totp-secret: ${SHOONYA_TOTP_SECRET:JBSWY3DPEHPK3PXP}
      vendor-code: ${SHOONYA_VENDOR_CODE:mock_vendor}
      api-key: ${SHOONYA_API_KEY:mock_api_key}
      base-url: ${SHOONYA_BASE_URL:https://api.shoonya.com}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

ironfly:
  underlyings: ${IRONFLY_UNDERLYINGS:NIFTY,RELIANCE,HDFCBANK}
  max-concurrent: ${IRONFLY_MAX_CONCURRENT:3}
  discovery-window-mins: ${IRONFLY_DISCOVERY_WINDOW:30}
  profit-target-pct: ${IRONFLY_PROFIT_TARGET:4}
  stop-loss-pct: ${IRONFLY_STOP_LOSS:8}
  expiry-guard-days: ${IRONFLY_EXPIRY_GUARD:4}
  decay-threshold-pct: ${IRONFLY_DECAY_THRESHOLD:70}
  target-delta: ${IRONFLY_TARGET_DELTA:0.25}
  hedge-credit-buffer: ${IRONFLY_HEDGE_BUFFER:0.5}
  min-straddle-pct-of-spot: ${IRONFLY_MIN_STRADDLE_PCT:2.0}
  min-oi: ${IRONFLY_MIN_OI:1000}
  max-bid-ask-spread-pct: ${IRONFLY_MAX_SPREAD:1.5}
  short-leg-loss-pct: ${IRONFLY_SHORT_LEG_LOSS:70}
  hedge-profit-pct: ${IRONFLY_HEDGE_PROFIT:50}

st-intraday:
  enabled: ${ST_INTRADAY_ENABLED:false}
  strategy-id: ${ST_INTRADAY_STRATEGY_ID:ST_INTRADAY_01}
  account-id: ${ST_INTRADAY_ACCOUNT_ID:KITE_USER_01}
  symbol: ${ST_INTRADAY_SYMBOL:NFO:NIFTY_50}
  super-trend:
    atr-length: ${ST_INTRADAY_ATR_LENGTH:7}
    multiplier: ${ST_INTRADAY_MULTIPLIER:3.0}
  rsi:
    period: ${ST_INTRADAY_RSI_PERIOD:14}
    threshold: ${ST_INTRADAY_RSI_THRESHOLD:50.0}
  option-selection:
    target-delta: ${ST_INTRADAY_TARGET_DELTA:0.20}
    min-premium: ${ST_INTRADAY_MIN_PREMIUM:70.0}
  risk:
    stop-loss-pct: ${ST_INTRADAY_STOP_LOSS_PCT:30.0}
    profit-target-pct: ${ST_INTRADAY_PROFIT_TARGET_PCT:0.0}
    max-trades-per-day: ${ST_INTRADAY_MAX_TRADES:2}
  lots: ${ST_INTRADAY_LOTS:1}
  eod-exit-time: ${ST_INTRADAY_EOD_EXIT_TIME:15:20}
  re-entry-cooldown-candles: ${ST_INTRADAY_REENTRY_COOLDOWN:3}
  blackout-days: ${ST_INTRADAY_BLACKOUT_DAYS:}

bot:
  db-path: ${BOT_DB_PATH:data/trading_state.db}
  paper-trading:
    # Default ON for safety. Set PAPER_TRADING_ENABLED=false for live money.
    enabled: ${PAPER_TRADING_ENABLED:true}
  instrument:
    db-path: ${INSTRUMENT_DB_PATH:data/instruments.db}
  marketdata:
    silence-threshold-seconds: ${SILENCE_THRESHOLD_SECONDS:3}
  calendar:
    # NSE trading holidays (official 2026 list). Override via NSE_HOLIDAYS env.
    holidays: ${NSE_HOLIDAYS:2026-01-15,2026-01-26,2026-03-03,2026-03-26,2026-03-31,2026-04-03,2026-04-14,2026-05-01,2026-05-28,2026-06-26,2026-09-14,2026-10-02,2026-10-20,2026-11-10,2026-11-24,2026-12-25}
  strategies:
    lowest-volume-reversal:
      id: ${LVR_STRATEGY_ID:LOWEST_VOL_REV_01}
      account-id: ${LVR_ACCOUNT_ID:KITE_USER_01}
      symbols: ${LVR_SYMBOLS:}
      max-trades-per-day: ${LVR_MAX_TRADES:2}
      min-rr-ratio: ${LVR_MIN_RR:2.0}
      momentum-candles: ${LVR_MOMENTUM_CANDLES:2}
    vwap-nifty:
      id: ${VWAP_STRATEGY_ID:VWAP_NIFTY_01}
      account-id: ${VWAP_ACCOUNT_ID:KITE_USER_01}
      symbol: ${VWAP_SYMBOL:NFO:NIFTY_FUT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      kite:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      shoonya:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      kite:
        limit-for-period: 3
        limit-refresh-period: 1s
        timeout-duration: 2s
      shoonya:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 2s
