---
services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sharadprsn/trading-bot:latest
    container_name: trading-bot
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SERVER_PORT=3000
      - INSTRUMENT_DB_PATH=/app/data/instruments.db
      - LOGGING_FILE_NAME=/app/logs/trading-bot.log
      - >-
        JAVA_OPTS=-Dserver.port=3000 -XX:+UseSerialGC -Xms256m -Xmx384m
        -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Kolkata
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 600M
        reservations:
          cpus: "0.25"
          memory: 300M
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3000/actuator/health"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - trading-net
    depends_on:
      init-permissions:
        condition: service_completed_successfully

  init-permissions:
    image: alpine:latest
    container_name: trading-bot-init-permissions
    user: root
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command:
      - "sh"
      - "-c"
      - >-
        mkdir -p /app/data /app/logs &&
        chown -R 10001:10001 /app/data /app/logs &&
        chmod -R 777 /app/data /app/logs

  ngrok:
    container_name: trading-bot-ngrok
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "trading-bot:3000"
      - "--url=${NGROK_DOMAIN:-untaxed-substance-reputably.ngrok-free.dev}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    mem_limit: 80m
    mem_reservation: 30m
    ports:
      - "4040:4040"
    networks:
      - trading-net
    depends_on:
      - trading-bot
    volumes:
      - ngrok-data:/data

networks:
  trading-net:
    driver: bridge

volumes:
  kite-session:
  ngrok-data:
