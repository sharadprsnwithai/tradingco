spring:
  application:
    name: trading-bot
  task:
    scheduling:
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

kite:
  base-url: https://api.kite.trade
  http:
    connect-timeout: 5s
    read-timeout: 10s
    place-read-timeout: 15s
  auth:
    initial-retry: 1m
    max-retry: 20m
    max-attempts-per-hour: 3
  orders:
    lost-grace: 30s
