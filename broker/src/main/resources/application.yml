spring:
  application:
    name: trading-bot
  task:
    scheduling:
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

kite:
  base-url: https://api.kite.trade
  http:
    connect-timeout: 5s
    read-timeout: 10s
    place-read-timeout: 15s
  auth:
    initial-retry: 1m
    max-retry: 20m
    max-attempts-per-hour: 3
  orders:
    lost-grace: 30s

strategy:
  execution-mode: ${STRATEGY_EXECUTION_MODE:PAPER}
  lots: ${STRATEGY_LOTS:2}
  sl-percentage: ${STRATEGY_SL_PERCENTAGE:30.0}
  trail-to-breakeven: ${STRATEGY_TRAIL_TO_BREAKEVEN:true}
  nifty-hedge-distance: 1000
  sensex-hedge-distance: 2000
